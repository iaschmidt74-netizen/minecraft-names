name: Alleen site publiceren

# Handmatig: zet de nieuwste versie van de site online, met de huidige scandata erbij.
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Huidige scandata van de site meenemen
        run: |
          mkdir -p site/data
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for f in freed.json status.json; do
            curl -sfL "$base/$f" -o "site/data/$f" || rm -f "site/data/$f"
          done
          ls -la site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
